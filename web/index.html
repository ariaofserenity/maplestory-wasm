<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MapleStory WASM Client</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }

        #container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        #canvas {
            border: none;
            background-color: #000;
            display: block;
            outline: none;
            cursor: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>

<body>
    <div id="container">
        <canvas id="canvas" tabindex="-1"></canvas>
    </div>

    <script>
        (function () {
            // Must match Constants::VIEWWIDTH / VIEWHEIGHT in the client. The
            // client switches to its larger in-game size through setGameSize
            // below, so these are the starting login dimensions only.
            let GAME_WIDTH = 800;
            let GAME_HEIGHT = 600;

            function syncCanvasResolution(canvas) {
                if (canvas.width === GAME_WIDTH && canvas.height === GAME_HEIGHT) {
                    return;
                }

                // Set the backing store directly rather than through emscripten's
                // Module.setCanvasSize. That helper also drives canvas.style,
                // clearing the width and height this page sets and re-deriving
                // them from the screen when fullscreen, which fights the fit
                // below and leaves the canvas sized to something other than the
                // viewport.
                canvas.width = GAME_WIDTH;
                canvas.height = GAME_HEIGHT;
            }

            function getFittedCanvasSize(viewW, viewH) {
                // Scale by whole multiples only. A fractional factor makes
                // nearest-neighbour duplicate some source rows and columns and
                // not others, which is what leaves the art looking chewed up, so
                // the canvas is centred inside whatever space is left over
                // instead of being stretched to fill it exactly.
                const scale = Math.min(viewW / GAME_WIDTH, viewH / GAME_HEIGHT);
                if (scale >= 1) {
                    const factor = Math.floor(scale);
                    return {
                        width: GAME_WIDTH * factor,
                        height: GAME_HEIGHT * factor
                    };
                }

                // Nothing to snap to below a single multiple, so fall back to the
                // largest aspect correct fit rather than overflowing the window.
                if (viewW * GAME_HEIGHT <= viewH * GAME_WIDTH) {
                    const width = Math.max(1, Math.floor(viewW));
                    return {
                        width,
                        height: Math.max(1, Math.floor(width * GAME_HEIGHT / GAME_WIDTH))
                    };
                }

                const height = Math.max(1, Math.floor(viewH));
                return {
                    width: Math.max(1, Math.floor(height * GAME_WIDTH / GAME_HEIGHT)),
                    height
                };
            }

            function fitCanvas() {
                const canvas = document.getElementById('canvas');
                if (!canvas) {
                    return;
                }

                // Keep the render surface fixed and only scale it with CSS.
                syncCanvasResolution(canvas);

                const { width, height } = getFittedCanvasSize(window.innerWidth, window.innerHeight);
                const w = width + 'px';
                const h = height + 'px';

                // Only write when something actually differs, so the observer
                // below settles instead of retriggering itself forever.
                if (canvas.style.width !== w || canvas.style.height !== h) {
                    canvas.style.setProperty('width', w, 'important');
                    canvas.style.setProperty('height', h, 'important');
                }
            }

            // Emscripten sizes the canvas itself when the GL window is created
            // and from its own resize listener, both of which run after this
            // page's, so whatever is set here gets overwritten and only comes
            // back on the next resize. Re-fitting whenever the canvas element is
            // touched makes this page authoritative regardless of that ordering.
            let fitScheduled = false;
            function scheduleFit() {
                if (fitScheduled) {
                    return;
                }

                fitScheduled = true;
                requestAnimationFrame(function () {
                    fitScheduled = false;
                    fitCanvas();
                });
            }

            function watchCanvas() {
                const canvas = document.getElementById('canvas');
                if (!canvas || typeof MutationObserver !== 'function') {
                    return;
                }

                new MutationObserver(scheduleFit).observe(canvas, {
                    attributes: true,
                    attributeFilter: ['style', 'width', 'height']
                });
            }

            window.MapleWasmUI = {
                applyScale: fitCanvas,

                // Called by the client when it switches render resolution, so
                // the backing store and the aspect ratio fit follow along.
                setGameSize: function (width, height) {
                    if (width > 0 && height > 0) {
                        GAME_WIDTH = width;
                        GAME_HEIGHT = height;
                        fitCanvas();
                    }
                }
            };

            window.addEventListener('resize', scheduleFit);
            document.addEventListener('fullscreenchange', scheduleFit);
            watchCanvas();
            fitCanvas();
        })();

        Module = {
            canvas: (function () {
                let canvas = document.getElementById('canvas');
                canvas.addEventListener("webglcontextlost", function (e) {
                    alert('WebGL context lost. You will need to reload the page.');
                    e.preventDefault();
                }, false);
                canvas.addEventListener("click", function () {
                    canvas.focus();
                });
                return canvas;
            })(),

            // Disable stdin to prevent annoying prompt() popups
            preRun: [function () {
                function stdin() {
                    return null; // Return null for EOF
                }
                FS.init(stdin, null, null);
            }],

            print: function (text) {
                console.log('[stdout]', text);
            },

            printErr: function (text) {
                console.error('[stderr]', text);
            },

            setStatus: function (text) {
                if (text) {
                    console.log('[status]', text);
                }
            },

            monitorRunDependencies: function (left) {
                console.log('[dependencies]', left, 'remaining');
            },

            onRuntimeInitialized: function () {
                console.log('[runtime] Initialized');
                if (window.MapleWasmUI && window.MapleWasmUI.applyScale) {
                    window.MapleWasmUI.applyScale();
                }
            },

            // Function to add C++ logs - now just console
            addCppLog: function (level, message) {
                let timestamp = new Date().toLocaleTimeString('en-US', { hour12: false });
                console.log('[' + timestamp + '] [' + level + '] ' + message);
            }
        };

        console.log('[status] Downloading...');

        window.onerror = function (event) {
            console.error('[post-exception status] Exception thrown, see JavaScript console');
        };

        // Fetch configuration before loading the client
        fetch('/web/config.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(config => {
                if (config) {
                    let hasConfig = false;
                    const lazyConfig = {};

                    const lazyConfigKeys = [
                        'AssetsServerIP', 'AssetsServerPort',
                        'MapleStoryServerIp', 'MapleStoryServerPort',
                        'ProxyIP', 'ProxyPort', 'AssetsServerProtocol'
                    ];

                    lazyConfigKeys.forEach(key => {
                        if (config[key] !== undefined && config[key] !== null) {
                            lazyConfig[key] = config[key];
                            console.log(`[config] Set ${key} from config.json:`, config[key]);
                            hasConfig = true;
                        }
                    });

                    if (hasConfig) {
                        Module.LazyFS = Object.assign(Module.LazyFS || {}, lazyConfig);
                    }
                }
                loadWasmClient();
            })
            .catch(err => {
                console.warn('[config] Could not load /web/config.json, proceeding with defaults. Error:', err.message);
                loadWasmClient();
            });

        function loadWasmClient() {
            const script = document.createElement('script');
            script.src = '/build/JourneyClient.js';
            script.async = true;
            document.body.appendChild(script);
        }
    </script>
</body>

</html>
